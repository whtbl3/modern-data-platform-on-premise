coordinator:
  replicas: 1
  resources:
    requests:
      memory: 4Gi
      cpu: 2000m

worker:
  replicas: 3
  resources:
    requests:
      memory: 16Gi
      cpu: 8000m

catalogs:
  iceberg: |
    connector.name=iceberg
    hive.metastore.uri=thrift://hive-metastore.prod:9083
    iceberg.file-format=PARQUET
    hive.s3.endpoint=http://minio.prod:9000
    hive.s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
    hive.s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
    hive.s3.path-style-access=true
  clickhouse: |
    connector.name=clickhouse
    connection-url=jdbc:clickhouse://clickhouse.prod:8123
    connection-user=superset
