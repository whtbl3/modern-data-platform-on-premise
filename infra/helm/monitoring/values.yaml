# kube-prometheus-stack values — VietMart Lakehouse
prometheus:
  retention: 30d
  storage:
    size: 100Gi
  additionalRuleFiles:
    - /etc/prometheus/rules/vietmart-*.yaml

grafana:
  enabled: true
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
  dashboardProviders:
    - name: vietmart
      folder: VietMart Lakehouse
      type: file
      options:
        path: /var/lib/grafana/dashboards/vietmart
  dashboardsConfigMaps:
    vietmart: vietmart-grafana-dashboards
  datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      isDefault: true
    - name: ClickHouse
      type: grafana-clickhouse-datasource
      url: http://clickhouse:8123
      jsonData:
        defaultDatabase: default
    - name: Trino
      type: trino
      url: http://trino:8080
      jsonData:
        catalog: iceberg

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: slack-default
      routes:
        - match:
            severity: critical
          receiver: slack-critical
          repeat_interval: 1h
        - match:
            business_impact: "true"
          receiver: slack-finance
    receivers:
      - name: slack-default
        slack_configs:
          - channel: "#data-alerts"
            send_resolved: true
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      - name: slack-critical
        slack_configs:
          - channel: "#data-alerts-critical"
            send_resolved: true
            title: 'CRITICAL: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      - name: slack-finance
        slack_configs:
          - channel: "#finance-data"
            send_resolved: true
            title: 'Revenue Alert: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

keda:
  enabled: true

additionalPrometheusRulesMap:
  vietmart-lakehouse:
    groups: []  # Loaded from PrometheusRule CRD (lakehouse-alerts.yaml)
