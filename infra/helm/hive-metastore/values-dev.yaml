image:
  repository: apache/hive
  tag: "3.1.3"

replicas: 1

resources:
  requests:
    memory: 1Gi
    cpu: 500m

database:
  type: postgres
  host: postgres.dev
  port: 5432
  name: hive_metastore
  user: hive
  existingSecret: hive-metastore-db

warehouse:
  dir: s3a://dev-staging/warehouse

s3:
  endpoint: http://minio.dev:9000
  pathStyleAccess: true
