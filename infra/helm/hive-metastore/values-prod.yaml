image:
  repository: apache/hive
  tag: "3.1.3"

replicas: 2

resources:
  requests:
    memory: 2Gi
    cpu: 1000m

database:
  type: postgres
  host: postgres.prod
  port: 5432
  name: hive_metastore
  user: hive
  existingSecret: hive-metastore-db

warehouse:
  dir: s3a://prod-staging/warehouse

s3:
  endpoint: http://minio.prod:9000
  pathStyleAccess: true
