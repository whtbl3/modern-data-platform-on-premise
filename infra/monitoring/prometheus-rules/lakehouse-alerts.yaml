apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vietmart-lakehouse-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # =========================================================================
    # DATA PIPELINE HEALTH
    # =========================================================================
    - name: pipeline.health
      rules:
        - alert: DagsterRunFailed
          expr: |
            increase(dagster_run_failure_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
            team: data-engineering
          annotations:
            summary: "Dagster pipeline run failed"
            description: "A Dagster run failed in the last 5 minutes. Check Dagster UI for details."
            runbook_url: "docs/runbooks/dagster-run-failed.md"

        - alert: DagsterRunStuck
          expr: |
            dagster_run_duration_seconds{status="STARTED"} > 7200
          for: 5m
          labels:
            severity: warning
            team: data-engineering
          annotations:
            summary: "Dagster run running for over 2 hours"
            description: "Run {{ $labels.run_id }} has been running for {{ $value | humanizeDuration }}."
            runbook_url: "docs/runbooks/dagster-run-stuck.md"

        - alert: DbtTestFailure
          expr: |
            increase(dagster_asset_materialization_failure_total{asset_key="dbt_tests"}[15m]) > 0
          for: 0m
          labels:
            severity: critical
            team: data-engineering
          annotations:
            summary: "dbt tests failed — data quality issue"
            description: "dbt test failures detected. Revenue or reconciliation data may be inaccurate."
            runbook_url: "docs/runbooks/dbt-test-failure.md"

    # =========================================================================
    # KAFKA / STREAMING
    # =========================================================================
    - name: streaming.health
      rules:
        - alert: KafkaConsumerLag
          expr: |
            kafka_consumergroup_lag_sum{consumergroup=~"flink-.*"} > 100000
          for: 5m
          labels:
            severity: warning
            team: data-engineering
          annotations:
            summary: "Kafka consumer lag > 100K for {{ $labels.consumergroup }}"
            description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has lag {{ $value }}."
            runbook_url: "docs/runbooks/kafka-consumer-lag.md"

        - alert: KafkaConsumerLagCritical
          expr: |
            kafka_consumergroup_lag_sum{consumergroup=~"flink-.*"} > 500000
          for: 3m
          labels:
            severity: critical
            team: data-engineering
          annotations:
            summary: "CRITICAL: Kafka consumer lag > 500K"
            description: "Consumer group {{ $labels.consumergroup }} lag is {{ $value }}. Real-time dashboards are stale."
            runbook_url: "docs/runbooks/kafka-consumer-lag.md"

        - alert: FlinkJobNotRunning
          expr: |
            flink_jobmanager_job_uptime == 0 or absent(flink_jobmanager_job_uptime)
          for: 2m
          labels:
            severity: critical
            team: data-engineering
          annotations:
            summary: "Flink job {{ $labels.job_name }} is not running"
            description: "Flink job has been down for 2 minutes. Real-time analytics are offline."
            runbook_url: "docs/runbooks/flink-job-down.md"

        - alert: FlinkCheckpointFailing
          expr: |
            increase(flink_jobmanager_job_lastCheckpointFailed[10m]) > 3
          for: 0m
          labels:
            severity: warning
            team: data-engineering
          annotations:
            summary: "Flink checkpoints failing repeatedly"
            description: "3+ checkpoint failures in 10 minutes for job {{ $labels.job_name }}."
            runbook_url: "docs/runbooks/flink-checkpoint-failure.md"

    # =========================================================================
    # STORAGE (MinIO / Iceberg)
    # =========================================================================
    - name: storage.health
      rules:
        - alert: MinIODiskUsageHigh
          expr: |
            minio_cluster_disk_used_bytes / minio_cluster_disk_total_bytes > 0.85
          for: 10m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "MinIO disk usage above 85%"
            description: "MinIO cluster disk usage is {{ $value | humanizePercentage }}. Plan capacity expansion."
            runbook_url: "docs/runbooks/minio-disk-full.md"

        - alert: MinIODiskUsageCritical
          expr: |
            minio_cluster_disk_used_bytes / minio_cluster_disk_total_bytes > 0.95
          for: 5m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "CRITICAL: MinIO disk usage above 95%"
            description: "MinIO will stop accepting writes soon. Immediate action required."
            runbook_url: "docs/runbooks/minio-disk-full.md"

        - alert: MinIONodeDown
          expr: |
            minio_cluster_nodes_offline_total > 0
          for: 2m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "MinIO node(s) offline"
            description: "{{ $value }} MinIO node(s) are offline. Data redundancy is degraded."
            runbook_url: "docs/runbooks/minio-node-down.md"

    # =========================================================================
    # CLICKHOUSE (Real-time OLAP)
    # =========================================================================
    - name: clickhouse.health
      rules:
        - alert: ClickHouseQuerySlow
          expr: |
            histogram_quantile(0.95, rate(clickhouse_query_duration_seconds_bucket[5m])) > 5
          for: 10m
          labels:
            severity: warning
            team: data-engineering
          annotations:
            summary: "ClickHouse P95 query latency above 5s"
            description: "Dashboard queries may be slow. Check for large scans or missing indexes."
            runbook_url: "docs/runbooks/clickhouse-slow-queries.md"

        - alert: ClickHouseReplicationLag
          expr: |
            clickhouse_replicas_max_queue_size > 100
          for: 5m
          labels:
            severity: warning
            team: infra
          annotations:
            summary: "ClickHouse replication queue growing"
            description: "Replica queue has {{ $value }} entries. Reads from replicas may be stale."

    # =========================================================================
    # RECONCILIATION / DATA QUALITY
    # =========================================================================
    - name: data.quality
      rules:
        - alert: RevenueReconciliationDrift
          expr: |
            lakehouse_reconciliation_discrepancy_pct > 1.0
          for: 0m
          labels:
            severity: critical
            team: data-engineering
            business_impact: "true"
          annotations:
            summary: "Revenue discrepancy between batch and streaming > 1%"
            description: "Batch total: {{ $labels.batch_total }}, Stream total: {{ $labels.stream_total }}, Drift: {{ $value }}%"
            runbook_url: "docs/runbooks/reconciliation-drift.md"

        - alert: NoDataIngested
          expr: |
            increase(dagster_asset_materialization_total{asset_key=~"raw_.*"}[2h]) == 0
          for: 2h
          labels:
            severity: warning
            team: data-engineering
          annotations:
            summary: "No raw data ingested in 2 hours"
            description: "Asset {{ $labels.asset_key }} has not materialized in 2 hours. Source may be down."
            runbook_url: "docs/runbooks/no-data-ingested.md"

    # =========================================================================
    # INFRASTRUCTURE (K8s / Node)
    # =========================================================================
    - name: infra.health
      rules:
        - alert: NodeDiskPressure
          expr: |
            kube_node_status_condition{condition="DiskPressure", status="true"} == 1
          for: 5m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "Node {{ $labels.node }} has disk pressure"
            description: "Kubernetes node is running low on disk. Pods may be evicted."

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace=~"lakehouse-.*"}[15m]) > 0.1
          for: 5m
          labels:
            severity: warning
            team: data-engineering
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is restarting frequently."

        - alert: SparkExecutorOOM
          expr: |
            increase(spark_executor_jvm_heap_memory_max_exceeded_total[10m]) > 0
          for: 0m
          labels:
            severity: warning
            team: data-engineering
          annotations:
            summary: "Spark executor OOM detected"
            description: "A Spark executor ran out of memory. Job may need memory tuning."
            runbook_url: "docs/runbooks/spark-oom.md"
