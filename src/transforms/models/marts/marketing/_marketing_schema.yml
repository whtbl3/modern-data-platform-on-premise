version: 2

models:
  - name: fct_campaign_performance
    description: Campaign attribution and conversion metrics. CMO weekly review.
    columns:
      - name: campaign
        tests:
          - not_null
      - name: conversion_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

  - name: fct_funnel_daily
    description: Conversion funnel by day/referrer/device. Marketing optimization.
    columns:
      - name: date_key
        tests:
          - not_null
      - name: overall_conversion_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
